<title>Colourbox graphics</title>
<style>
:root {
  --bg: #15191b; --edge: #3b4347; --ink: #e7e9e4; --ink-soft: #9aa4a7; --accent: #ea6a2c; --pointer: #f1eee4;
  --cap: #101315; --cap-hi: #2a3134; --panel: #2a3033; --track: #1b2022;
  --f-display: "Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;

}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); -webkit-user-select: none; user-select: none; cursor: default }
.stage { position: absolute; inset: 0 }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none }
.fallback { position: absolute; inset: 0; margin: auto; height: max-content; text-align: center; color: var(--ink-soft); font: 13px -apple-system, sans-serif }
.tabs { position: absolute; left: 12px; top: 6px; display: flex; gap: 14px }
.tabs button { font: 500 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0 4px; cursor: pointer }
.tabs button:hover { color: var(--ink) }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
</style></head><body>
